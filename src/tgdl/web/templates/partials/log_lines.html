{% from "_macros.html" import pager_nav %}
{% if entries %}
<div class="log">
{% for e in entries %}<pre class="log-line lvl-{{ (e.level or 'none') | lower }}">{{ e.text }}</pre>
{% endfor %}
</div>
{{ pager_nav(pager, "/logs", query, t) }}
{% else %}
<p class="muted">{{ t("logs.empty") }}</p>
{% endif %}
