{% extends "base.html" %}
{% block title %}{{ t("login.title") }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("login.title") }}</h1>
  {% if error %}<div class="banner banner-err" role="alert">{{ t(error, **error_params) }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t("login.username") }}
      <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none"
             spellcheck="false" required maxlength="64" {% if not username %}autofocus{% endif %}>
    </label>
    <label>{{ t("login.password") }}
      <input type="password" name="password" autocomplete="current-password" required maxlength="1024"
             {% if username %}autofocus{% endif %}>
    </label>
    <button type="submit" class="btn btn-primary">{{ t("login.submit") }}</button>
  </form>
</section>
{% endblock %}
